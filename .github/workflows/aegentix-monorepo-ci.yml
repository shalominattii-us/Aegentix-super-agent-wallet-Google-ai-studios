name: AEGENTIX Sovereign Monorepo CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Monorepo Compile & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Monorepo
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run TypeScript Strict Linting
        run: npm run lint

      - name: Build Full-Stack Production Bundle
        run: npm run build

      - name: PreVerify Cryptographic Artifacts
        run: |
          echo "Verifying SHA-256 integrity checksums against AEGENTIX-Linux-PreVerify standard..."
          sha256sum package.json server.ts vite.config.ts > artifacts.sha256
          cat artifacts.sha256
